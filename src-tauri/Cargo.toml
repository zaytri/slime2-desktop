# Cargo.toml manifest documentation https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "slime2"
version = "0.0.0"
description = "Local Stream Widget Manager"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# necessary for tauri
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = [] }

# added for slime2
chrono = "0.4.45"
font-kit = { version = "0.14.3" }
futures = "0.3.34"
junk_file = "0.1.1"
keyring = "4.1.6"
log = "0.4.33"
nanoid = "0.5.0"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
sysinfo = "0.39.6"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-log = "2.9.0"
tauri-plugin-opener = "2.5.4"
tauri-plugin-shell = "2.3.5"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-window-state = "2.4.1"
time = { version = "0.3.55", features = ["formatting", "local-offset"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
walkdir = "2.5.0"
warp = { version = "0.4.3", features = ["server", "websocket"] }
webbrowser = { version = "1.2.4", features = ["hardened", "disable-wsl"] }
zip = "8.6.0"

[features]
#! This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

